    <script>
      // Clean up any stale service workers or caches that could cause white screens
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) {
              caches.delete(names[i]);
            }
          });
        }
      } catch (e) {
        console.warn('Storage cleanup non-critical error:', e);
      }

      // Diagnostic handler in case of fatal bundle loading failure
      window.addEventListener('error', function(e) {
        console.error('[PII-LCC Diagnostic Error]:', e);
      });
    </script>
