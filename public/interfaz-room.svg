<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#081424" />
      <stop offset="50%" stop-color="#040b14" />
      <stop offset="100%" stop-color="#020509" />
    </radialGradient>

    <!-- Cyan Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Amber Glow -->
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Blue Data Stream Gradient -->
    <linearGradient id="streamBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.9" />
    </linearGradient>

    <!-- Amber Data Stream Gradient -->
    <linearGradient id="streamAmber" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.9" />
    </linearGradient>

    <!-- Hologram Grid Pattern -->
    <pattern id="tacticalGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0ea5e9" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Deep Atmosphere Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />
  <rect width="1920" height="1080" fill="url(#tacticalGrid)" opacity="0.4" />

  <!-- SECTION 1: TOP TIER (FIELD OPERATIONS & SATELLITE COMMS) -->
  <g id="topTier">
    <!-- Mountain Silhouettes -->
    <path d="M 0 320 L 140 230 L 320 270 L 460 210 L 600 280 L 800 180 L 960 220 L 1150 160 L 1380 250 L 1580 190 L 1750 260 L 1920 210 L 1920 360 L 0 360 Z" fill="#0b1726" opacity="0.7" />
    <path d="M 0 340 L 220 280 L 380 310 L 580 250 L 820 300 L 1050 240 L 1300 290 L 1500 260 L 1720 300 L 1920 270 L 1920 360 L 0 360 Z" fill="#08101a" opacity="0.9" />

    <!-- Satellite Uplink Station (Center Top) -->
    <g transform="translate(960, 80)" filter="url(#glowCyan)">
      <!-- Satellite Dish -->
      <ellipse cx="0" cy="0" rx="36" ry="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" transform="rotate(-30)" />
      <line x1="-10" y1="0" x2="20" y2="-20" stroke="#38bdf8" stroke-width="2.5" />
      <circle cx="20" cy="-20" r="4" fill="#00f0ff" />
      <path d="M -15 15 L 0 45 L 15 15" fill="none" stroke="#64748b" stroke-width="3" />
      
      <!-- Radio Frequency Wave Beams downward -->
      <path d="M -80 60 Q 0 80 80 60" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
      <path d="M -130 90 Q 0 120 130 90" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
      <path d="M -180 120 Q 0 160 180 120" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2" />

      <!-- High-speed data optical cables to core -->
      <path d="M 0 45 C 0 150 -350 200 -360 400" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 4" opacity="0.75" />
      <path d="M 0 45 C 0 160 -100 240 -30 420" fill="none" stroke="#00f0ff" stroke-width="4" opacity="0.8" />
      <path d="M 0 45 C 0 160 100 240 30 420" fill="none" stroke="#00f0ff" stroke-width="4" opacity="0.8" />
    </g>

    <!-- Tactical All-Terrain Vehicle (Left Top) -->
    <g transform="translate(420, 180)" filter="url(#glowCyan)">
      <!-- Holographic ATV icon & outline -->
      <rect x="-40" y="-30" width="80" height="50" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
      <circle cx="-25" cy="20" r="16" fill="#020617" stroke="#38bdf8" stroke-width="2.5" />
      <circle cx="25" cy="20" r="16" fill="#020617" stroke="#38bdf8" stroke-width="2.5" />
      <path d="M -30 -10 L -10 -25 L 15 -25 L 30 -5" fill="none" stroke="#38bdf8" stroke-width="2" />
      <text x="0" y="3" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">ATV-PATROL</text>
      <!-- Comms beam to satellite -->
      <path d="M 0 -30 Q 300 -100 540 -100" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5" />
    </g>

    <!-- Tactical Drone ISR in flight (Mid-Right Top) -->
    <g transform="translate(1220, 120)" filter="url(#glowCyan)">
      <ellipse cx="0" cy="0" rx="28" ry="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <line x1="-35" y1="-5" x2="35" y2="-5" stroke="#38bdf8" stroke-width="2" />
      <circle cx="-35" cy="-5" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="35" cy="-5" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="0" cy="5" r="4" fill="#ef4444" />
      <!-- Downward scanning cone -->
      <polygon points="0,10 -60,180 60,180" fill="url(#streamBlue)" opacity="0.15" />
    </g>

    <!-- Mesh Logistics Network (Top Right Town/Target) -->
    <g transform="translate(1620, 170)" filter="url(#glowCyan)">
      <circle cx="0" cy="0" r="6" fill="#38bdf8" />
      <circle cx="-70" cy="-30" r="5" fill="#38bdf8" />
      <circle cx="60" cy="-20" r="5" fill="#38bdf8" />
      <circle cx="-50" cy="40" r="5" fill="#38bdf8" />
      <circle cx="50" cy="50" r="5" fill="#38bdf8" />
      <circle cx="100" cy="10" r="5" fill="#38bdf8" />

      <line x1="0" y1="0" x2="-70" y2="-30" stroke="#0ea5e9" stroke-width="1.5" opacity="0.7" />
      <line x1="0" y1="0" x2="60" y2="-20" stroke="#0ea5e9" stroke-width="1.5" opacity="0.7" />
      <line x1="0" y1="0" x2="-50" y2="40" stroke="#0ea5e9" stroke-width="1.5" opacity="0.7" />
      <line x1="0" y1="0" x2="50" y2="50" stroke="#0ea5e9" stroke-width="1.5" opacity="0.7" />
      <line x1="60" y1="-20" x2="100" y2="10" stroke="#0ea5e9" stroke-width="1.5" opacity="0.7" />
      <line x1="50" y1="50" x2="100" y2="10" stroke="#0ea5e9" stroke-width="1.5" opacity="0.7" />
      <line x1="-70" y1="-30" x2="-50" y2="40" stroke="#0ea5e9" stroke-width="1.5" opacity="0.7" />
      <text x="0" y="-45" fill="#bae6fd" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">RED LOGÍSTICA OBJETIVO</text>
    </g>
  </g>

  <!-- Horizontal divider line -->
  <line x1="0" y1="360" x2="1920" y2="360" stroke="#1e293b" stroke-width="2" />
  <line x1="0" y1="360" x2="1920" y2="360" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="12 12" opacity="0.4" />

  <!-- SECTION 2: MIDDLE TIER (DATA SERVERS + HOLOGRAPHIC CORE + PANORAMIC CURVED SCREEN) -->
  <g id="middleTier">
    <!-- Server Center Racks (Left) -->
    <g transform="translate(180, 500)">
      <rect x="-80" y="-120" width="160" height="240" rx="4" fill="#0a121c" stroke="#1e293b" stroke-width="2" />
      <!-- Server Units -->
      <g fill="#0284c7" opacity="0.8">
        <rect x="-70" y="-110" width="140" height="12" rx="2" fill="#0f172a" stroke="#0369a1" stroke-width="1" />
        <circle cx="-60" cy="-104" r="2" fill="#22c55e" />
        <circle cx="-52" cy="-104" r="2" fill="#38bdf8" />
        <rect x="-70" y="-92" width="140" height="12" rx="2" fill="#0f172a" stroke="#0369a1" stroke-width="1" />
        <circle cx="-60" cy="-86" r="2" fill="#22c55e" />
        <rect x="-70" y="-74" width="140" height="12" rx="2" fill="#0f172a" stroke="#0369a1" stroke-width="1" />
        <circle cx="-60" cy="-68" r="2" fill="#38bdf8" />
        <rect x="-70" y="-56" width="140" height="12" rx="2" fill="#0f172a" stroke="#0369a1" stroke-width="1" />
        <circle cx="-60" cy="-50" r="2" fill="#22c55e" />
        <rect x="-70" y="-38" width="140" height="12" rx="2" fill="#0f172a" stroke="#0369a1" stroke-width="1" />
        <rect x="-70" y="-20" width="140" height="12" rx="2" fill="#0f172a" stroke="#0369a1" stroke-width="1" />
        <rect x="-70" y="-2" width="140" height="12" rx="2" fill="#0f172a" stroke="#0369a1" stroke-width="1" />
        <rect x="-70" y="16" width="140" height="12" rx="2" fill="#0f172a" stroke="#0369a1" stroke-width="1" />
        <rect x="-70" y="34" width="140" height="12" rx="2" fill="#0f172a" stroke="#0369a1" stroke-width="1" />
        <rect x="-70" y="52" width="140" height="12" rx="2" fill="#0f172a" stroke="#0369a1" stroke-width="1" />
        <rect x="-70" y="70" width="140" height="12" rx="2" fill="#0f172a" stroke="#0369a1" stroke-width="1" />
        <rect x="-70" y="88" width="140" height="12" rx="2" fill="#0f172a" stroke="#0369a1" stroke-width="1" />
        <rect x="-70" y="106" width="140" height="12" rx="2" fill="#0f172a" stroke="#0369a1" stroke-width="1" />
      </g>

      <!-- Holographic Data Planes projecting rightward toward core -->
      <g filter="url(#glowCyan)" opacity="0.85">
        <polygon points="90,-80 180,-100 180,80 90,100" fill="url(#streamBlue)" opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
        <polygon points="190,-70 270,-85 270,65 190,80" fill="url(#streamBlue)" opacity="0.4" stroke="#00f0ff" stroke-width="1.5" />
        <polygon points="280,-60 350,-70 350,50 280,60" fill="url(#streamBlue)" opacity="0.5" stroke="#38bdf8" stroke-width="1.5" />
        <polygon points="360,-50 420,-55 420,35 360,40" fill="url(#streamBlue)" opacity="0.6" stroke="#00f0ff" stroke-width="2" />
        <polygon points="430,-40 480,-40 480,20 430,20" fill="url(#streamBlue)" opacity="0.7" stroke="#38bdf8" stroke-width="2" />
      </g>
    </g>

    <!-- THE CENTRAL HOLOGRAPHIC TESSERACT / CORE NODE -->
    <g transform="translate(960, 520)" filter="url(#glowCyan)">
      <!-- Pedestal base -->
      <polygon points="-120,150 120,150 160,190 -160,190" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
      <rect x="-100" y="140" width="200" height="10" fill="#0284c7" opacity="0.7" />

      <!-- Vertical Glow beam upward to satellite -->
      <polygon points="-80,140 -40,-350 40,-350 80,140" fill="url(#streamBlue)" opacity="0.25" />

      <!-- Outer Crystal Polyhedron -->
      <polygon points="0,-140 120,-60 120,60 0,140 -120,60 -120,-60" fill="#0369a1" fill-opacity="0.15" stroke="#38bdf8" stroke-width="3" />
      
      <!-- Inner Rhombic Facets -->
      <line x1="0" y1="-140" x2="0" y2="140" stroke="#00f0ff" stroke-width="2" />
      <line x1="-120" y1="-60" x2="120" y2="60" stroke="#38bdf8" stroke-width="2" />
      <line x1="-120" y1="60" x2="120" y2="-60" stroke="#38bdf8" stroke-width="2" />

      <!-- Concentric Floating Core Cube -->
      <g transform="rotate(45)">
        <rect x="-45" y="-45" width="90" height="90" fill="#0284c7" fill-opacity="0.4" stroke="#ffffff" stroke-width="2.5" />
        <rect x="-25" y="-25" width="50" height="50" fill="#38bdf8" fill-opacity="0.6" stroke="#00f0ff" stroke-width="2" />
        <circle cx="0" cy="0" r="12" fill="#ffffff" filter="url(#glowCyan)" />
      </g>

      <!-- Conduit Links branching to the right (Panoramic Screen) -->
      <path d="M 120 -20 Q 250 -40 380 -30" fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="8 4" />
      <path d="M 120 20 Q 250 40 380 30" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="8 4" />
      <path d="M 120 0 L 380 0" fill="none" stroke="#38bdf8" stroke-width="4" />
    </g>

    <!-- Panoramic Curved Holographic GIS Display (Right) -->
    <g transform="translate(1550, 500)" filter="url(#glowCyan)">
      <!-- Curved screen bezel -->
      <path d="M -260 -150 Q 0 -130 260 -160 L 250 160 Q 0 130 -270 140 Z" fill="#040e1a" stroke="#0284c7" stroke-width="3" opacity="0.9" />
      <path d="M -250 -140 Q 0 -120 250 -150 L 240 150 Q 0 120 -260 130 Z" fill="#020a14" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5" />

      <!-- Holographic Map Contours -->
      <path d="M -230 40 Q -150 -60 -50 -10 Q 50 40 180 -20" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.9" />
      <path d="M -210 80 Q -100 -20 20 60 Q 120 -80 220 20" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
      <path d="M -180 -80 Q -60 -100 80 -40 Q 180 80 230 60" fill="none" stroke="#10b981" stroke-width="2" opacity="0.7" />

      <!-- Target Node Marker -->
      <circle cx="-50" cy="-10" r="10" fill="none" stroke="#ef4444" stroke-width="2" />
      <circle cx="-50" cy="-10" r="4" fill="#ef4444" />
      <line x1="-50" y1="-25" x2="-50" y2="5" stroke="#ef4444" stroke-width="1.5" />
      <line x1="-65" y1="-10" x2="-35" y2="-10" stroke="#ef4444" stroke-width="1.5" />

      <!-- Org Hierarchy Tree (Right edge of screen) -->
      <g transform="translate(160, -20)">
        <rect x="-20" y="-40" width="40" height="20" rx="3" fill="#0369a1" stroke="#38bdf8" stroke-width="1" />
        <line x1="0" y1="-20" x2="0" y2="0" stroke="#38bdf8" stroke-width="1.5" />
        <line x1="-40" y1="0" x2="40" y2="0" stroke="#38bdf8" stroke-width="1.5" />
        <rect x="-55" y="10" width="30" height="16" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <rect x="-15" y="10" width="30" height="16" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <rect x="25" y="10" width="30" height="16" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      </g>
    </g>
  </g>

  <!-- SECTION 3: BOTTOM TIER (TACTICAL OPERATORS + AMBER NEURAL CONDUITS + FIELD TABLETS) -->
  <g id="bottomTier">
    <!-- Amber Energy Stream branching down from Core to Consoles and Tablets -->
    <g filter="url(#glowAmber)">
      <!-- Main downward trunk -->
      <path d="M 960 670 C 960 740 920 800 680 830" fill="none" stroke="url(#streamAmber)" stroke-width="8" stroke-linecap="round" />
      <path d="M 960 670 C 960 760 1020 810 1180 840" fill="none" stroke="url(#streamAmber)" stroke-width="8" stroke-linecap="round" />
      <path d="M 1250 845 L 1520 845" fill="none" stroke="url(#streamAmber)" stroke-width="6" stroke-dasharray="12 6" />

      <!-- Arrowheads -->
      <polygon points="670,830 690,820 690,840" fill="#f59e0b" />
      <polygon points="1530,845 1510,835 1510,855" fill="#f59e0b" />
    </g>

    <!-- Command Console Operator (Bottom Left) -->
    <g transform="translate(360, 890)">
      <!-- Operator Silhouette in uniform with headset -->
      <ellipse cx="-120" cy="-70" r="38" fill="#152232" stroke="#2a4365" stroke-width="2" />
      <!-- Headset -->
      <path d="M -140 -85 Q -120 -115 -100 -85" fill="none" stroke="#38bdf8" stroke-width="3" />
      <rect x="-98" y="-75" width="10" height="16" rx="4" fill="#38bdf8" />
      <!-- Torso / Uniform -->
      <path d="M -160 50 L -150 -20 Q -120 -30 -90 -20 L -80 50 Z" fill="#1e2d42" />
      <!-- Arm to console controls -->
      <path d="M -90 -10 Q -40 20 40 10" fill="none" stroke="#2d4059" stroke-width="24" stroke-linecap="round" />

      <!-- Triple Tactical Monitors Console -->
      <!-- Monitor 1 -->
      <polygon points="-40,-100 60,-100 50,-10 -50,-10" fill="#040d1a" stroke="#0284c7" stroke-width="2" />
      <circle cx="5" cy="-55" r="18" fill="none" stroke="#ef4444" stroke-width="2" />
      <circle cx="5" cy="-55" r="4" fill="#ef4444" />
      
      <!-- Monitor 2 (Center) -->
      <polygon points="70,-100 170,-100 160,-10 60,-10" fill="#040d1a" stroke="#0284c7" stroke-width="2" />
      <path d="M 90 -40 Q 120 -80 150 -40" fill="none" stroke="#f59e0b" stroke-width="2" />

      <!-- Monitor 3 (Right) -->
      <polygon points="180,-100 270,-100 260,-10 170,-10" fill="#040d1a" stroke="#0284c7" stroke-width="2" />
      <circle cx="225" cy="-55" r="14" fill="none" stroke="#00f0ff" stroke-width="1.5" />
      <circle cx="225" cy="-55" r="5" fill="#00f0ff" filter="url(#glowCyan)" />

      <!-- Console desk surface with tactile controls -->
      <polygon points="-70,20 300,20 280,100 -90,100" fill="#0b131e" stroke="#1e293b" stroke-width="2" />
      <rect x="20" y="35" width="80" height="30" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <rect x="120" y="35" width="90" height="35" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
    </g>

    <!-- Field Operators with Tactical Ruggedized Tablets (Bottom Right) -->
    <g transform="translate(1380, 890)">
      <!-- Hands holding First Tablet -->
      <g transform="translate(-140, -40)" filter="url(#glowCyan)">
        <!-- Ruggedized Tablet Frame -->
        <rect x="-70" y="-55" width="140" height="110" rx="10" fill="#09121d" stroke="#38bdf8" stroke-width="3" />
        <rect x="-58" y="-45" width="116" height="90" rx="4" fill="#020812" stroke="#0284c7" stroke-width="1.5" />
        <!-- Miniature Holographic Core display on tablet screen -->
        <circle cx="0" cy="0" r="22" fill="none" stroke="#00f0ff" stroke-width="1.5" />
        <rect x="-12" y="-12" width="24" height="24" rx="2" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1" transform="rotate(45)" />
        <circle cx="0" cy="0" r="4" fill="#ffffff" />
        <!-- Protective bumper corners -->
        <circle cx="-65" cy="-50" r="5" fill="#1e293b" />
        <circle cx="65" cy="-50" r="5" fill="#1e293b" />
        <circle cx="-65" cy="50" r="5" fill="#1e293b" />
        <circle cx="65" cy="50" r="5" fill="#1e293b" />
      </g>

      <!-- Second Operator and Second Tablet -->
      <g transform="translate(180, -20)">
        <!-- Operator Silhouette -->
        <ellipse cx="60" cy="-90" r="36" fill="#152232" stroke="#2a4365" stroke-width="2" />
        <path d="M 20 60 L 30 -40 Q 60 -50 90 -40 L 100 60 Z" fill="#1e2d42" />
        <!-- Arm reaching forward touching tablet -->
        <path d="M 40 -20 Q 0 10 -40 0" fill="none" stroke="#2d4059" stroke-width="22" stroke-linecap="round" />

        <!-- Second Tablet Frame -->
        <g transform="translate(-80, -30)" filter="url(#glowCyan)">
          <rect x="-60" y="-45" width="120" height="90" rx="8" fill="#09121d" stroke="#38bdf8" stroke-width="2.5" />
          <rect x="-50" y="-36" width="100" height="72" rx="3" fill="#020812" stroke="#0284c7" stroke-width="1.5" />
          <path d="M -30 10 Q 0 -20 30 10" fill="none" stroke="#38bdf8" stroke-width="2" />
          <circle cx="0" cy="-5" r="8" fill="none" stroke="#00f0ff" stroke-width="1.5" />
          <circle cx="0" cy="-5" r="3" fill="#ffffff" />
        </g>
      </g>
    </g>
  </g>

  <!-- Tactical Vignette & HUD Frame Overlay -->
  <rect width="1920" height="1080" fill="none" stroke="#0284c7" stroke-width="4" opacity="0.6" />
  <path d="M 40 20 L 20 20 L 20 40" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 1880 20 L 1900 20 L 1900 40" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 40 1060 L 20 1060 L 20 1040" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 1880 1060 L 1900 1060 L 1900 1040" fill="none" stroke="#38bdf8" stroke-width="3" />
</svg>
